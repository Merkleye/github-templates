# .github/workflows/release.yml — for a repo whose release builds and pushes a
# container image with an SBOM attestation per image.
#
# The build comes from the template too, via `images`. Each entry is built for
# `container-platforms` and pushed as v1.2.3, v1 and latest — an exact pin plus
# the two moving tags. The repo keeps one line of `.releaserc`, which is where
# the build has to be invoked from:
#
#   ["@semantic-release/exec", {
#     "prepareCmd": "python3 \"$MERKLEYE_RELEASE_IMAGES\" ${nextRelease.version}"
#   }]
#
# In `prepare` and not in a step here because a build that fails in `prepare`
# aborts before the tag and the Release exist. A build in a later step would
# publish the release first and then fail, leaving a release that points at an
# image nobody can pull.
#
# An SPDX SBOM per image per platform comes with the build, and there is no
# input to turn it off — a published image without one is the gap. BuildKit
# produces it during the build, so there is no tool to pin and nothing to add
# to this file. It rides along as an attestation on the image:
#
#   docker buildx imagetools inspect <ref> --format '{{ json .SBOM }}'
name: Release

on:
  workflow_dispatch:

concurrency:
  # An in-flight release must never be cancelled mid-push; later triggers
  # queue behind it instead of racing it.
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # A caller must grant at least what the called job asks for — GitHub lets
    # a called workflow narrow the token, never widen it.
    permissions:
      contents: write
      packages: write
    uses: Merkleye/github-templates/.github/workflows/semantic-release.yml@main
    with:
      # @semantic-release/git pushes CHANGELOG.md to a protected main, which
      # the default GITHUB_TOKEN cannot do.
      app-token: true
      containers: true
      # Same JSON the repo's ghcr-pr-preview-image.yml caller passes, so the
      # preview builds exactly what the release will build.
      images: '[{"image":"my-service","context":".","file":"Containerfile"}]'
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

# Everything else is defaulted: `builder: auto` (resolved from `runs-on`),
# `container-platforms: linux/amd64,linux/arm64`, and a registry namespace of
# ghcr.io/<owner> lowercased — derived from `container-registry`, so the
# registry the job logs in to and the registry the tags name cannot drift.
#
# A Blacksmith release is this file with one line added:
#
#   with:
#     runs-on: blacksmith-2vcpu-ubuntu-2404

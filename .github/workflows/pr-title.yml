name: PR Title

# Reusable: validates that a pull request title follows the Conventional
# Commits spec (https://www.conventionalcommits.org).
#
# Merkleye repos squash-merge, so the PR title becomes the commit subject on
# the default branch — and that subject is what semantic-release parses to
# decide the next version. A PR titled "updates" is a release that never
# happens, or a major bump nobody asked for.
#
# The caller owns the trigger, because the two choices are a real trade-off:
#
#   - `pull_request` runs the check from the PR's own branch. This is the
#     right default, and the only one that works on the PR that *introduces*
#     the check -- see below.
#   - `pull_request_target` runs it from the base branch, so the rules are
#     always the merged-in ones and cannot be edited by the PR under review.
#     Nothing here checks out or executes PR code, which is what makes that
#     safe. Worth it on a public repo taking fork PRs.
#
# The gotcha, and it is not obvious: `pull_request_target` reads the workflow
# file from the BASE branch, so a workflow that exists only on a PR branch
# never runs at all -- no check, no failure, nothing to notice. A repo
# adopting this check for the first time therefore gets no signal on the very
# PR that adds it, and the check only starts working after that PR merges.
# Adopt with `pull_request` (the check is then exercised on its own PR, which
# is also the proof that it works), and switch to `pull_request_target`
# afterwards if the repo wants it.
#
# Either way, include `edited` in `types:` -- without it, fixing a rejected
# title never re-runs the check and the PR stays red.

on:
  workflow_call:
    inputs:
      types:
        description: >-
          Newline-separated Conventional Commit types to accept. Defaults to
          the Angular set plus `build`, `ci` and `revert`, which is what the
          conventionalcommits preset understands.
        required: false
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
      scopes:
        description: >-
          Newline-separated scopes to allow. Empty (the default) allows any
          scope; set it only in a repo with a settled component vocabulary.
        required: false
        type: string
        default: ""
      require-scope:
        description: Require every title to carry a scope.
        required: false
        type: boolean
        default: false
      subject-pattern:
        description: >-
          Regex the subject (the part after `type(scope):`) must match. The
          default rejects a leading upper-case letter, keeping subjects in
          the imperative lower-case style the changelog renders.
        required: false
        type: string
        default: ^(?![A-Z]).+$
      subject-pattern-error:
        description: Message shown when subject-pattern does not match.
        required: false
        type: string
        default: |
          The subject "{subject}" must start with a lower-case letter, e.g.
          "feat: add ct log import".
      ignore-labels:
        description: >-
          Newline-separated labels that skip the check entirely. Useful for
          bot-authored PRs whose titles are set by tooling.
        required: false
        type: string
        default: ""
      runs-on:
        description: Runner label. Override for a repo on self-hosted runners.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 5

permissions: {}

jobs:
  conventional-title:
    name: Validate PR title
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Read-only: the action reads the PR title and reports through the
      # check run. It never writes a comment or a label.
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
          ignoreLabels: ${{ inputs.ignore-labels }}

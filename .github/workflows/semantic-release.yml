name: semantic-release

# Reusable: runs semantic-release against the calling repo's own
# .releaserc / release.config. What version to cut, what to publish, and what
# to attach are decided by that config — this workflow only assembles the
# environment semantic-release needs, which is the part every repo was
# copying.
#
# What it assembles:
#   - a full-history checkout (semantic-release reads every commit since the
#     last tag; a shallow one silently finds nothing to release)
#   - the repo's mise toolchain
#   - optionally, a GitHub App token, when releases must push through branch
#     protection or reach a second repository (the default GITHUB_TOKEN can
#     do neither), plus the App's bot identity on the release commit
#   - optionally, an .npmrc for publishing to a registry
#   - optionally, a container builder and a registry login, for the repos
#     whose release also builds and pushes an image — and, with `images`, the
#     build itself, so the three repos doing this stop keeping three copies of
#     the same script
#   - optionally, an SBOM generated by syft and attached to the GitHub Release
#     semantic-release just cut
#
# What it deliberately does not assemble is a tool. A release that needs syft
# or cosign declares it in mise.release.toml and gets it from the same
# installer as the rest of the toolchain — see `mise-env` below. `sbom: true`
# is the one place this workflow invokes such a tool rather than only putting
# it on PATH, and it still does not install it: it fails with the two lines to
# add to mise.release.toml if the toolchain does not pin syft. Attaching the
# asset is the part every repo was reimplementing; which version of syft runs
# stays a property of the repo's toolchain.
#
# The container half is here rather than in a release template of its own
# because everything around it — the full-history checkout, the App token, the
# bot identity, the toolchain, the install — is identical either way, and a
# second workflow would have been a copy of this one with four steps added.
# A repo that ships no image sets nothing and gets no container steps.
#
# The caller owns the trigger. Both shapes are in use across the org and both
# are legitimate: `push` to the default branch for zero-touch releases, or
# `workflow_dispatch` where cutting a release is a deliberate act. A `push`
# caller must make sure its release commit carries [skip ci] (semantic-release
# does this by default) or the workflow retriggers itself.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 30
      lfs:
        description: >-
          Check out git-lfs objects. Required where the published artifact
          contains LFS-tracked files, or the release ships pointer stubs.
        required: false
        type: boolean
        default: false
      app-token:
        description: >-
          Mint a GitHub App installation token and release with it instead of
          GITHUB_TOKEN. Needs the CLIENT_ID and APP_PRIVATE_KEY secrets.
        required: false
        type: boolean
        default: false
      app-repositories:
        description: >-
          Newline-separated repositories the App token should cover. Defaults
          to the calling repository alone. List more only when the release
          genuinely writes to them (e.g. syncing a dashboard to a website
          repo) — the token is as broad as this list.
        required: false
        type: string
        default: ""
      npm-registry-url:
        description: >-
          Registry to authenticate against, e.g. https://npm.pkg.github.com.
          Empty skips the .npmrc setup entirely.
        required: false
        type: string
        default: ""
      npm-scope:
        description: Package scope for the registry, e.g. "@merkleye".
        required: false
        type: string
        default: ""
      containers:
        description: >-
          Set up a container builder and log in to a registry, for a release
          whose prepare step builds and pushes images. This assembles what that
          build needs — a builder on PATH, QEMU for the emulated half of
          `container-platforms`, an authenticated registry — and never runs the
          build itself, which belongs to semantic-release's prepare phase. Set
          `images` too and the build comes from here as well; leave it empty and
          the repo supplies its own script.
        required: false
        type: boolean
        default: false
      container-registry:
        description: Registry to log in to. Only read when `containers` is true.
        required: false
        type: string
        default: ghcr.io
      container-platforms:
        description: >-
          Platforms the release publishes. Exported to the release script as
          CONTAINER_PLATFORMS and used to register QEMU, so one list decides
          both what is built and what can execute. The default is the pair an
          OCI image is expected to ship; narrow it only for an artifact that
          genuinely is single-architecture.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      container-builder:
        description: >-
          `auto`, `docker`, or `blacksmith`. `auto` reads the runner label,
          same rule as ghcr-pr-preview-image.yml: anything containing
          `blacksmith` gets useblacksmith/*, everything else gets docker/*.
        required: false
        type: string
        default: auto
      images:
        description: >-
          JSON array of {image, context, file} objects the release publishes —
          the same shape ghcr-pr-preview-image.yml and container-ci.yml take,
          so a repo declares its image set once and the preview builds what the
          release will build. Example:
          [{"image":"dnstwist","context":".","file":"Containerfile"}]

          Setting it hands the release the org's build, which pushes each image
          tagged v<version>, v<major> and latest. The repo's release config
          then only has to invoke it, from its prepare step:

            ["@semantic-release/exec", {
              "prepareCmd": "python3 \"$MERKLEYE_RELEASE_IMAGES\" ${nextRelease.version}"
            }]

          Leaving it empty keeps the older arrangement, where `containers: true`
          assembles a builder and a login and the repo's own script does the
          build. Only read when `containers` is true.
        required: false
        type: string
        default: ""
      container-namespace:
        description: >-
          Registry and namespace the release tags name, e.g. ghcr.io/merkleye.
          Empty derives it from `container-registry` and the repository owner,
          which is right for every GHCR repo. Only read when `images` is set.
        required: false
        type: string
        default: ""
      sbom:
        description: >-
          Generate an SBOM with syft after a successful release and upload it
          to the GitHub Release as an asset. Skipped on a dry run, and skipped
          when semantic-release decided there was nothing to release — there
          is no release to attach to in either case.

          syft is not installed here. It has to be pinned in mise.release.toml
          like the rest of the toolchain, and this step fails with the lines to
          add if it is not — see `mise-env`.
        required: false
        type: boolean
        default: false
      sbom-target:
        description: >-
          What syft scans. `dir:.` is the checked-out source, which is the
          right answer for a release whose artifact is the repo. A release that
          publishes an image should scan the image it just pushed, so that the
          SBOM describes the layers a user actually pulls rather than the tree
          they were built from:

            sbom-target: ghcr.io/merkleye/my-service:$RELEASE_VERSION

          `$RELEASE_TAG` (the tag semantic-release created, e.g. v1.4.0) and
          `$RELEASE_VERSION` (the same without the leading `v`) are substituted
          literally — the version is not known until semantic-release has run,
          so it cannot be interpolated by the caller.
        required: false
        type: string
        default: dir:.
      sbom-format:
        description: >-
          syft output format, e.g. spdx-json, cyclonedx-json, syft-json.
        required: false
        type: string
        default: spdx-json
      sbom-file:
        description: >-
          Filename the SBOM is uploaded under. This is what a consumer sees on
          the release page, so it should say which format it is in.
        required: false
        type: string
        default: sbom.spdx.json
      mise-env:
        description: >-
          mise config environment for the job (MISE_ENV). `release` loads
          mise.release.toml on top of mise.toml, which is where the tools only
          a release needs belong — syft for an SBOM, cosign for a signature.
          Pinning them there rather than installing them from an action means
          one place decides the version, a contributor can run the release
          steps locally, and a PR run never pays for them. `sbom: true` reads
          syft from exactly this config; setting `mise-env` to something that
          does not pin syft turns it into a failed release, not a silent one.
        required: false
        type: string
        default: release
      install-command:
        description: Command that installs the release tooling.
        required: false
        type: string
        default: npm ci
      pre-release-command:
        description: >-
          Optional command run after install and before semantic-release —
          the last chance to refuse to ship. Validation belongs here; building
          belongs in the release config's own prepare step, so a dry run
          exercises it too.
        required: false
        type: string
        default: ""
      dry-run:
        description: Run semantic-release with --dry-run, publishing nothing.
        required: false
        type: boolean
        default: false
    secrets:
      CLIENT_ID:
        description: >-
          GitHub App Client ID. Required when app-token is true. The App's
          numeric id is deprecated by create-github-app-token, which carries a
          deprecationMessage on its `app-id` input.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key. Required when app-token is true.
        required: false
      NPM_TOKEN:
        description: >-
          Registry auth token. Defaults to GITHUB_TOKEN, which is what
          publishing to GitHub Packages in the same org needs.
        required: false

permissions: {}

jobs:
  release:
    name: semantic-release
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A called workflow's permissions are absolute for its job and a caller
    # must grant at least them, so this is the minimum rather than the union:
    # asking for issues/pull-requests write here would force every caller to
    # grant it, including the repos whose .releaserc sets successComment and
    # failComment to false. A repo that does want semantic-release to comment
    # on released issues needs those two scopes added here — and then every
    # caller has to grant them too, so raise it as a change to this template
    # rather than working around it locally.
    permissions:
      contents: write # tags, the release commit, the GitHub Release
      packages: write # publishing to GitHub Packages
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: inputs.app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ inputs.app-repositories != '' && inputs.app-repositories || github.event.repository.name }}

      - name: Resolve the release token
        id: token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${APP_TOKEN:-$DEFAULT_TOKEN}"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 — semantic-release decides the next version from every
      # commit since the last tag, and finds none in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: ${{ inputs.lfs }}
          token: ${{ steps.token.outputs.token }}

      # GitHub attributes a bot commit by the bot *user's* id, not the App's
      # — they are different numbers, and using the App id leaves the release
      # commit showing an unlinked author. The bot user is public, so one
      # lookup gets it.
      - name: Configure the App's git identity
        if: inputs.app-token
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - uses: Merkleye/github-templates/.github/actions/setup-mise@main
        with:
          env: ${{ inputs.mise-env }}

      # Not managing the Node version — mise already put Node on PATH from
      # mise.toml. This only writes the .npmrc that @semantic-release/npm and
      # `npm publish` authenticate with.
      - name: Configure registry auth
        if: inputs.npm-registry-url != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: ${{ inputs.npm-registry-url }}
          scope: ${{ inputs.npm-scope }}

      # One rule for `auto`, shared with ghcr-pr-preview-image.yml — see
      # .github/actions/resolve-builder.
      - name: Resolve builder
        id: builder
        if: inputs.containers
        uses: Merkleye/github-templates/.github/actions/resolve-builder@main
        with:
          builder: ${{ inputs.container-builder }}
          runs-on: ${{ inputs.runs-on }}

      # Registering the runner's own architecture is a no-op, so the publish
      # list can be passed straight through instead of maintaining a second
      # list of just the emulated half.
      - name: Set up QEMU
        if: inputs.containers && inputs.container-platforms != ''
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: ${{ inputs.container-platforms }}

      - name: Set up Buildx
        if: steps.builder.outputs.builder == 'docker'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Blacksmith builder
        if: steps.builder.outputs.builder == 'blacksmith'
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0

      # GITHUB_TOKEN, not the App token: pushing a package needs `packages:
      # write` on this repo, which the job already has, and the App token is
      # scoped for git writes that may reach further than that.
      - name: Log in to the container registry
        if: inputs.containers
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.container-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This does not build anything — it puts the build script's path and its
      # inputs on the job environment for semantic-release's prepare step to
      # invoke. The build has to run inside `prepare`: a failure there aborts
      # before the tag and the Release exist, where a failure in a later
      # workflow step would leave a published release pointing at an image that
      # was never pushed. See the action for the rest of the reasoning.
      - name: Prepare the container release build
        if: inputs.containers && inputs.images != ''
        uses: Merkleye/github-templates/.github/actions/release-images@main
        with:
          images: ${{ inputs.images }}
          registry: ${{ inputs.container-namespace }}
          registry-host: ${{ inputs.container-registry }}
          platforms: ${{ inputs.container-platforms }}

      - name: Install release tooling
        run: ${{ inputs.install-command }}

      - name: Pre-release checks
        if: inputs.pre-release-command != ''
        env:
          CONTAINER_PLATFORMS: ${{ inputs.container-platforms }}
        run: ${{ inputs.pre-release-command }}

      # semantic-release prints the version it cut but exposes it to the
      # workflow nowhere, and reading "the latest release" back from the API
      # afterwards is a guess — a concurrent release, or a run that published
      # nothing, both return a tag that looks plausible. Diffing the local tag
      # list across the run is exact: semantic-release creates the tag itself,
      # so exactly one name appears, and none appears when it decided there was
      # nothing to release.
      - name: Record the tags that already exist
        if: inputs.sbom && !inputs.dry-run
        run: git tag | sort > "$RUNNER_TEMP/tags-before"

      # CONTAINER_PLATFORMS reaches the repo's release script through
      # semantic-release's exec plugin: the caller names the platforms once,
      # in the workflow, instead of the workflow and the script each holding
      # their own list and agreeing until one of them is edited.
      - name: Run semantic-release
        env:
          CONTAINER_PLATFORMS: ${{ inputs.container-platforms }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN != '' && secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Resolve the released tag
        id: released
        if: inputs.sbom && !inputs.dry-run
        run: |
          set -euo pipefail
          git tag | sort > "$RUNNER_TEMP/tags-after"
          tag="$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "semantic-release published nothing; no SBOM to attach."
          else
            echo "Released $tag."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # syft comes off PATH as a mise shim, which is why setup-mise exports
      # MISE_ENV for the whole job rather than for its own step.
      - name: Generate the SBOM
        if: steps.released.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.released.outputs.tag }}
          SBOM_TARGET: ${{ inputs.sbom-target }}
          SBOM_FORMAT: ${{ inputs.sbom-format }}
          SBOM_FILE: ${{ inputs.sbom-file }}
        run: |
          set -euo pipefail
          if ! mise which syft >/dev/null 2>&1; then
            echo "sbom: true, but the toolchain does not pin syft. Add it to mise.release.toml:" >&2
            printf '\n[tools]\nsyft = "1"\n\n' >&2
            exit 1
          fi
          # The version is only known now, so the caller writes a placeholder
          # instead of an expression. Plain parameter substitution, not eval:
          # the target is a caller-supplied string and never becomes shell.
          version="${RELEASE_TAG#v}"
          target="${SBOM_TARGET//\$RELEASE_TAG/$RELEASE_TAG}"
          target="${target//\$RELEASE_VERSION/$version}"
          syft --version
          echo "Scanning $target"
          syft scan "$target" --output "$SBOM_FORMAT=$RUNNER_TEMP/$SBOM_FILE"

      # --clobber so a re-run of a failed release replaces the half-uploaded
      # asset instead of erroring on the name already being taken.
      - name: Attach the SBOM to the release
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TAG: ${{ steps.released.outputs.tag }}
          SBOM_FILE: ${{ inputs.sbom-file }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$SBOM_FILE" --clobber

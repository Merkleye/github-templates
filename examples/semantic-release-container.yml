# .github/workflows/release.yml — for a repo whose release builds and pushes a
# container image and attaches an SBOM to the GitHub Release.
#
# The image itself is built by the repo's own `.releaserc`, through
# @semantic-release/exec calling scripts/release-image.sh. Tags and SBOM
# layout are decisions about the artifact and live there; the template only
# makes sure a builder and an authenticated registry exist by the time that
# script runs.
#
# syft is not an input here. It goes in mise.release.toml beside the rest of
# the toolchain, and `mise-env: release` (the default) is what loads it:
#
#   # mise.release.toml — tools only a release needs
#   [tools]
#   syft = "1"
name: Release

on:
  workflow_dispatch:

concurrency:
  # An in-flight release must never be cancelled mid-push; later triggers
  # queue behind it instead of racing it.
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # A caller must grant at least what the called job asks for — GitHub lets
    # a called workflow narrow the token, never widen it.
    permissions:
      contents: write
      packages: write
    uses: Merkleye/github-templates/.github/workflows/semantic-release.yml@main
    with:
      # @semantic-release/git pushes CHANGELOG.md to a protected main, which
      # the default GITHUB_TOKEN cannot do.
      app-token: true
      containers: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

# Everything else is defaulted: ghcr.io, `builder: auto` (resolved from
# `runs-on`), and `container-platforms: linux/amd64,linux/arm64` — reachable
# in the release script as $CONTAINER_PLATFORMS, so the workflow and the
# script cannot disagree about what ships.
#
# A Blacksmith release is this file with one line added:
#
#   with:
#     runs-on: blacksmith-2vcpu-ubuntu-2404

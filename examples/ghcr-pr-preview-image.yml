# .github/workflows/pr-preview-image.yml
#
# This is the whole PR gate for a repo that ships container images: the
# template runs the repo's mise test task first and builds nothing until it
# passes, so there is no separate ci.yml to keep in step with it. Ordering is
# why the test job lives in the template — `needs:` cannot reach across
# workflows, so a test job in a neighbouring file cannot gate this one.
name: PR preview image lifecycle

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions: {}

# A job that calls a reusable workflow must grant at least the permissions the
# called job asks for -- GitHub lets a called workflow narrow the token, never
# widen it. These blocks mirror the template's own job permissions exactly.

jobs:
  publish:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-image.yml@main
    with:
      # Keep this list in step with whatever the release script publishes.
      images: >-
        [
          {"image":"merkleye","context":".","file":"Containerfile"},
          {"image":"merkleye-dnstwist","context":"sidecars/dnstwist","file":"sidecars/dnstwist/Containerfile"}
        ]
      # Defaults to `test`; name it only when the repo's mise.toml calls the
      # task something else. A repo whose gate is several tasks wraps them in
      # one mise task and names that -- the composition belongs in mise.toml,
      # where a contributor runs the same thing locally.
      test-task: ci
      builder: blacksmith
      runs-on: blacksmith-2vcpu-ubuntu-2404

  cleanup:
    if: github.event.action == 'closed'
    permissions:
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-cleanup.yml@main
    with:
      packages: '["merkleye","merkleye-dnstwist"]'
      runs-on: blacksmith-2vcpu-ubuntu-2404

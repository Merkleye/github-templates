# .github/workflows/pr-preview-prune.yml
name: Prune stale PR previews

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

# A job that calls a reusable workflow must grant at least the permissions the
# called job asks for -- GitHub lets a called workflow narrow the token, never
# widen it. These blocks mirror the template's own job permissions exactly.

jobs:
  prune:
    permissions:
      contents: read
    uses: Merkleye/github-templates/.github/workflows/cf-pages-preview-prune.yml@main
    with:
      project-name: merkleye-website
      max-age-days: 7
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

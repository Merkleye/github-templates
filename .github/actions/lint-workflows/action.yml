name: Lint workflows
description: >-
  Runs actionlint over a repo's workflows and enforces the org's `uses:`
  conventions — SHA-pinned third-party actions, and no direct reference to an
  action the org wraps.

# The conventions are only real if something checks them. Without this, "every
# repo resolves mise through setup-mise" is a thing someone has to remember
# and periodically re-audit by hand — which is how five call sites in `design`
# and one in `merkleye-website` kept their own copy of the pin long after the
# shared action existed.
#
# Every rule is an input, because a repo that genuinely needs an exception
# should declare it in its own caller where a reviewer can see it, rather than
# being unable to adopt the check at all.
#
# actionlint reads workflow files only; the pin and ban checks also walk
# composite actions, which is where the last raw references tend to hide.
#
# actionlint itself comes from this repo's mise.toml -- the version is a pin
# beside the rest of the org's toolchain, not an input a caller can drift on.
# See the comments there for how it reaches a consuming repo.

inputs:
  actionlint:
    description: Run actionlint.
    required: false
    default: "true"
  actionlint-paths:
    description: >-
      Space-separated globs for actionlint, expanded by the shell. Workflow
      files only — actionlint does not read action.yml.
    required: false
    default: .github/workflows/*.yml
  scan-paths:
    description: >-
      Newline-separated files or directories to walk for the `uses:` checks.
      Directories are searched recursively for *.yml and *.yaml.
    required: false
    default: |
      .github/workflows
      .github/actions
  require-sha-pins:
    description: Require every third-party action to name a 40-character commit SHA.
    required: false
    default: "true"
  allow-tags:
    description: >-
      Newline-separated `uses:` prefixes exempt from the SHA rule. The default
      covers this templates repo referring to itself (pinning it would mean
      rewriting every internal reference on every change) and useblacksmith/*,
      which publishes major-version tags only. An entry here is the record of
      an exception, so add one with a reason next to it.
    required: false
    default: |
      Merkleye/github-templates/
      useblacksmith/
  banned-actions:
    description: >-
      Newline-separated `<prefix> <replacement>` pairs. A `uses:` starting
      with the prefix fails, and the message names the replacement. The
      default is the mise installer: the org's pin is one number, held in
      setup-mise, and a repo pinning jdx/mise-action itself has quietly opted
      out of that.
    required: false
    default: |
      jdx/mise-action Merkleye/github-templates/.github/actions/setup-mise@main

runs:
  using: composite
  steps:
    # Through setup-mise, not jdx/mise-action: the ban this action enforces
    # applies to the action itself, and scan-paths covers .github/actions. The
    # @main self-reference is the same arrangement the reusable workflows use.
    #
    # This step is here for the mise binary only. It runs with install: false
    # and in a directory with no mise.toml in it, because anything it resolved
    # in the calling repo would be that repo's whole toolchain -- a Go build,
    # a Node install -- provisioned to lint YAML. The one tool this action
    # needs is installed by name below, at the version this repo pins.
    - name: Install mise
      if: inputs.actionlint == 'true'
      uses: Merkleye/github-templates/.github/actions/setup-mise@main
      with:
        install: "false"
        working-directory: ${{ runner.temp }}

    # PATHS is unquoted on purpose: the shell expands the globs here, in the
    # repo the job checked out, and the task appends the result to
    # actionlint's arguments.
    #
    # MISE_GLOBAL_CONFIG_FILE rather than a config in the calling repo: the
    # caller's mise.toml is its own toolchain and has no reason to carry a
    # linter it never invokes. As the global config it layers underneath,
    # which is what makes `mise run` resolve the task from the repo root.
    # MISE_AUTO_INSTALL stops that same run from provisioning the caller's
    # tools on the way to the task.
    - name: actionlint
      if: inputs.actionlint == 'true'
      shell: bash
      env:
        PATHS: ${{ inputs.actionlint-paths }}
        MISE_GLOBAL_CONFIG_FILE: ${{ github.action_path }}/../../../mise.toml
        MISE_AUTO_INSTALL: "false"
      run: |
        set -euo pipefail
        mise install actionlint
        # shellcheck disable=SC2086
        mise run lint:actionlint ${PATHS}

    - name: Check action references
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.scan-paths }}
        ALLOW_TAGS: ${{ inputs.allow-tags }}
        BANNED: ${{ inputs.banned-actions }}
        REQUIRE_SHA_PINS: ${{ inputs.require-sha-pins }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/check-workflows.py" \
          --paths "${SCAN_PATHS}" \
          --allow-tags "${ALLOW_TAGS}" \
          --banned "${BANNED}" \
          --require-sha-pins "${REQUIRE_SHA_PINS}"

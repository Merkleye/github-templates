name: Workflow lint

# Reusable: the job-level wrapper around the lint-workflows action, so a repo
# adopts the org's `uses:` conventions by adding one job rather than a step to
# an existing one.
#
# What it enforces and why is in .github/actions/lint-workflows. What this
# adds is the runner, the checkout and the timeout — and the fact that it is a
# job means a repo with no other CI (a docs repo, a config repo) can still
# have this one.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 10
      actionlint:
        description: Run actionlint.
        required: false
        type: boolean
        default: true
      actionlint-version:
        description: actionlint release to download.
        required: false
        type: string
        default: "1.7.7"
      actionlint-paths:
        description: Space-separated globs for actionlint. Workflow files only.
        required: false
        type: string
        default: .github/workflows/*.yml
      scan-paths:
        description: >-
          Newline-separated files or directories to walk for the `uses:`
          checks. Directories are searched recursively.
        required: false
        type: string
        default: |
          .github/workflows
          .github/actions
      require-sha-pins:
        description: Require every third-party action to name a 40-character commit SHA.
        required: false
        type: boolean
        default: true
      allow-tags:
        description: >-
          Newline-separated `uses:` prefixes exempt from the SHA rule. An
          entry is the record of an exception — put the reason beside it.
        required: false
        type: string
        default: |
          Merkleye/github-templates/
          useblacksmith/
      banned-actions:
        description: >-
          Newline-separated `<prefix> <replacement>` pairs. Defaults to the
          mise installer, which the org wraps in setup-mise.
        required: false
        type: string
        default: |
          jdx/mise-action Merkleye/github-templates/.github/actions/setup-mise@main

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # persist-credentials: false — this job only reads YAML.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Merkleye/github-templates/.github/actions/lint-workflows@main
        with:
          actionlint: ${{ inputs.actionlint }}
          actionlint-version: ${{ inputs.actionlint-version }}
          actionlint-paths: ${{ inputs.actionlint-paths }}
          scan-paths: ${{ inputs.scan-paths }}
          require-sha-pins: ${{ inputs.require-sha-pins }}
          allow-tags: ${{ inputs.allow-tags }}
          banned-actions: ${{ inputs.banned-actions }}

name: PR Title

# Dogfood: this repo lints its own PR titles with the template it ships. If
# the template breaks, this is the first PR that finds out.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    uses: Merkleye/github-templates/.github/workflows/pr-title.yml@58dd91dcb3fe12963f712bf055cb0a1b3ce93386 # main

# .github/workflows/ci.yml — for a repo that ships container images. The
# container-integrity build is the same everywhere and comes from the
# template; the test job above it is this repo's own and stays here, which is
# the usual split (README, "Extending, not forking", level 2).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Repo-specific: the task names belong to the repo, so this stays local and
  # only the installer is shared. See README, "The mise convention".
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Merkleye/github-templates/.github/actions/setup-mise@main
      - run: mise run test

  # Keep `images` in step with the PR-preview caller and the release script —
  # all three describe the same set, and a preview or a release that builds
  # something CI never did is the failure this job exists to prevent.
  container-build:
    permissions:
      contents: read
    uses: Merkleye/github-templates/.github/workflows/container-ci.yml@main
    with:
      images: '[{"image":"dnstwist","context":".","file":"Containerfile"}]'

# Everything else is defaulted: `ubuntu-latest`, `builder: auto` (which
# resolves to the docker builder on that label), the GitHub Actions layer
# cache, and a 15-minute timeout.
#
# On a Blacksmith runner, the label is the only thing to set — `auto` picks
# useblacksmith/* from it:
#
#   with:
#     images: >-
#       [
#         {"image":"merkleye","context":".","file":"Containerfile"},
#         {"image":"merkleye-certspotter","context":"sidecars/certspotter","file":"sidecars/certspotter/Containerfile"}
#       ]
#     runs-on: blacksmith-2vcpu-ubuntu-2404
#
# A self-hosted pool is the same shape, with whatever single label identifies
# it:
#
#   with:
#     images: '[{"image":"merkleye","context":".","file":"Containerfile"}]'
#     runs-on: self-hosted
